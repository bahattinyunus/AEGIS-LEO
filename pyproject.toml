[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-leo"
version = "2.0.0"
description = "Autonomous Edge-AI & Physics-Informed Orbital Safety Shield"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Bahattin Yunus Çetin", email = "bahattinyunuscetin@hotmail.com"}
]
keywords = ["astrodynamics", "orbital-mechanics", "space-weather", "edge-ai", "sgp4", "nasa-space-apps"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "torch>=2.2.0",
    "sgp4>=2.23",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "streamlit>=1.32.0",
    "plotly>=5.20.0",
]

[project.scripts]
aegis = "aegis_leo.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
